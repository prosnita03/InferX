[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inferx"
version = "0.1.0"
description = "InferX — LLM Inference Optimization & Benchmarking Platform"
readme = "README.md"
authors = [{ name = "InferX Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "accelerate>=0.28.0",
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "streamlit>=1.32.0",
    "scikit-learn>=1.4.0",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.42.0",
    "pynvml>=11.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
