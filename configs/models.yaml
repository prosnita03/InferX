# InferX Models Configuration

default_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
demo_model: "hf-internal-testing/tiny-random-gpt2"

models:
  "TinyLlama/TinyLlama-1.1B-Chat-v1.0":
    description: "Compact 1.1B parameter LLaMA-based model trained on 3T tokens, ideal for edge and developer benchmarking."
    architecture: "LlamaForCausalLM"
    parameters: 1100000000
    hidden_size: 2048
    num_hidden_layers: 22
    num_attention_heads: 32
    vocab_size: 32000
    max_position_embeddings: 2048
    supported_precisions: ["fp32", "fp16", "int8", "int4"]
    recommended_batch_sizes: [1, 2, 4, 8]
    memory_footprint_fp16_mb: 2200

  "Qwen/Qwen2.5-0.5B-Instruct":
    description: "Ultra-compact 0.5B instruction-tuned model with strong reasoning, suited for resource-constrained benchmarking."
    architecture: "Qwen2ForCausalLM"
    parameters: 490000000
    hidden_size: 896
    num_hidden_layers: 24
    num_attention_heads: 14
    vocab_size: 151936
    max_position_embeddings: 32768
    supported_precisions: ["fp32", "fp16", "int8", "int4"]
    recommended_batch_sizes: [1, 2, 4, 8, 16]
    memory_footprint_fp16_mb: 1000

  "Qwen/Qwen2.5-1.5B-Instruct":
    description: "High-capability 1.5B dense causal LM optimized for instruction following and reasoning."
    architecture: "Qwen2ForCausalLM"
    parameters: 1540000000
    hidden_size: 1536
    num_hidden_layers: 28
    num_attention_heads: 12
    vocab_size: 151936
    max_position_embeddings: 32768
    supported_precisions: ["fp32", "fp16", "int8", "int4"]
    recommended_batch_sizes: [1, 2, 4, 8]
    memory_footprint_fp16_mb: 3100

  "hf-internal-testing/tiny-random-gpt2":
    description: "Micro-scale synthetic model (<1M params) for fast zero-cost CI/CD testing and demo execution on any CPU."
    architecture: "GPT2LMHeadModel"
    parameters: 50000
    hidden_size: 64
    num_hidden_layers: 2
    num_attention_heads: 2
    vocab_size: 1000
    max_position_embeddings: 512
    supported_precisions: ["fp32"]
    recommended_batch_sizes: [1, 2, 4, 8]
    memory_footprint_fp16_mb: 5
